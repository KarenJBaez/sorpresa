<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Pegy ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #200105 0%, #070002 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* Contenedor Principal (Estilo Entrada de Cine de Terror) */
        .card {
            background: #141414;
            border: 2px dashed #e50914; 
            border-radius: 15px;
            padding: 35px 30px;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(229, 9, 20, 0.2);
            position: relative;
            transition: all 0.5s ease-in-out;
        }

        /* Decoración de boleto */
        .card::before, .card::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30px;
            height: 30px;
            background: #070002;
            border-radius: 50%;
        }
        .card::before { left: -16px; transform: translateY(-50%); border-right: 2px dashed #e50914; }
        .card::after { right: -16px; transform: translateY(-50%); border-left: 2px dashed #e50914; }

        /* Estados de las pantallas */
        .step {
            display: none;
            animation: fadeIn 0.6s ease forwards;
        }

        .step.active {
            display: block;
        }

        /* Dibujo del Cerdito en CSS/SVG Animado */
        .pig-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            animation: floatPig 3s ease-in-out infinite;
        }

        .pig-ear {
            animation: twitchEar 4s ease-in-out infinite;
            transform-origin: 50px 30px;
        }

        @keyframes floatPig {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes twitchEar {
            0%, 90%, 100% { transform: rotate(0deg); }
            93%, 97% { transform: rotate(-8deg); }
            95% { transform: rotate(4deg); }
        }

        /* Tipografías y Textos */
        h1 {
            font-size: 1.8rem;
            color: #e50914;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #e0e0e0;
        }

        .highlight {
            color: #ff333f;
            font-weight: bold;
            display: block;
            margin-top: 10px;
            font-size: 1.3rem;
            text-shadow: 0 0 10px rgba(255, 51, 63, 0.5);
        }

        /* Contenedor de botones iniciales */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        /* Botones Generales */
        .btn {
            background-color: #e50914;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #ff1f29;
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6);
        }

        .btn-secondary {
            background-color: #333;
            color: #aaa;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background-color: #444;
            color: #fff;
            transform: none;
            box-shadow: none;
        }

        /* Estilos del juego Multiple Choice (Paso 3) */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:hover {
            background: #333;
            border-color: #e50914;
        }

        .option-btn.selected {
            background: #e50914;
            border-color: #ff333f;
            font-weight: bold;
        }

        /* Pantalla Final Éxito */
        .success-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .ghost-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            font-size: 1.5rem;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        
        <!-- PASO 1: Bienvenida e Invitación Inicial -->
        <div id="step-1" class="step active">
            <div class="pig-container">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <ellipse class="pig-ear" cx="28" cy="28" rx="10" ry="14" fill="#ff8da1" transform="rotate(-15 28 28)" />
                    <ellipse class="pig-ear" cx="72" cy="28" rx="10" ry="14" fill="#ff8da1" transform="rotate(15 72 28)" />
                    <ellipse cx="28" cy="28" rx="5" ry="8" fill="#fca3b5" transform="rotate(-15 28 28)" />
                    <ellipse cx="72" cy="28" rx="5" ry="8" fill="#fca3b5" transform="rotate(15 72 28)" />
                    <circle cx="50" cy="53" r="34" fill="#ff99ad" />
                    <circle cx="38" cy="48" r="4.5" fill="#1c1c1c" />
                    <circle cx="36" cy="46" r="1.5" fill="#ffffff" />
                    <circle cx="62" cy="48" r="4.5" fill="#1c1c1c" />
                    <circle cx="60" cy="46" r="1.5" fill="#ffffff" />
                    <circle cx="24" cy="56" r="5" fill="#ff6b8b" opacity="0.6" />
                    <circle cx="76" cy="56" r="5" fill="#ff6b8b" opacity="0.6" />
                    <ellipse cx="50" cy="62" rx="14" ry="9" fill="#ff708d" />
                    <circle cx="45" cy="62" r="2.5" fill="#cc4461" />
                    <circle cx="55" cy="62" r="2.5" fill="#cc4461" />
                </svg>
            </div>
            <h1>¡Hola Pegy! ❤️</h1>
            <p>Tengo una invitación muy especial para hacerte...</p>
            <div class="btn-group">
                <button class="btn" onclick="cambiarPaso(2)">Aceptar</button>
                <button class="btn btn-secondary" onclick="alert('Piénsalo bien 🥺... ¡La invitación sigue en pie!')">No</button>
            </div>
        </div>

        <!-- PASO 2: La Propuesta del Cine -->
        <div id="step-2" class="step">
            <div style="font-size: 3.5rem; margin-bottom: 10px;">🍿🎬</div>
            <h1>Una noche de novios</h1>
            <p>Salida al cine a ver una peli de <span class="highlight">¡TERROR! 👻🔥</span></p>
            <button class="btn" onclick="cambiarPaso(3)">Ver más</button>
        </div>

        <!-- PASO 3: Selección de película en Moreno -->
        <div id="step-3" class="step">
            <h1>Elegí la peli 🎟️</h1>
            <p style="font-size: 1rem; margin-bottom: 15px;">📍 Cine de Moreno</p>
            
            <div class="options-container">
                <button class="option-btn" onclick="seleccionarOpcion(this, 'Madre siniestra (A la noche)')">👹 Madre siniestra (A la noche)</button>
                <button class="option-btn" onclick="seleccionarOpcion(this, 'Resident evil (A la noche)')">🧟 Resident evil (A la noche)</button>
            </div>

            <button class="btn" id="submit-choice" onclick="finalizar()" disabled style="opacity: 0.5; cursor: not-allowed;">Confirmar Cita</button>
        </div>

        <!-- PASO 4: Confirmación Final -->
        <div id="step-4" class="step">
            <div class="success-icon">🐷🍿❤️</div>
            <h1>¡Trato hecho!</h1>
            <p>Ya quedó agendada nuestra noche de terror en Moreno. ¡Preparate para los sustos!</p>
            <p style="font-size: 1.1rem; color: #aaa; margin-top: 15px;">Película elegida:<br><strong id="pelicula-final" style="color: #e50914; display:block; margin-top:5px;"></strong></p>
        </div>

    </div>

    <script {verify_synthid}>
        let peliculaSeleccionada = "";

        function cambiarPaso(numeroPaso) {
            document.querySelector('.step.active').classList.remove('active');
            document.getElementById(`step-${numeroPaso}`).classList.add('active');
        }

        function seleccionarOpcion(boton, nombrePeli) {
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            boton.classList.add('selected');
            peliculaSeleccionada = nombrePeli;

            const btnConfirmar = document.getElementById('submit-choice');
            btnConfirmar.disabled = false;
